<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bandeali Enterprises Treasure Box Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700;800;900&display=swap');
    body { 
      background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #533483 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      font-family:'Orbitron',sans-serif; 
      color:white; 
      min-height:100vh; 
      margin:0; 
      padding:0; 
      display:flex; 
      flex-direction:column; 
      align-items:center; 
      user-select:none; 
      text-align:center;
      overflow-x: hidden;
    }
    
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    /* Hidden Backend Tracker - Only visible in console */
    #hidden-tracker {
      display: none !important;
      visibility: hidden !important;
      position: absolute !important;
      top: -9999px !important;
      left: -9999px !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    
    /* Reduced Logo Glow */
    #logo { 
      max-width: 160px; 
      margin: 25px auto 10px auto; 
      user-select: none;
      border-radius: 25px; 
      display: block; 
      padding: 8px;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      position: relative;
      overflow: hidden;
    }
    
    /* Subtle Logo Glow */
    @keyframes subtleLogoGlow {
      0% { 
        box-shadow: 0 0 10px #fde14b, 0 0 20px #fde14b;
        filter: brightness(1.1);
      }
      25% { 
        box-shadow: 0 0 12px #fff856, 0 0 24px #fff856;
        filter: brightness(1.15);
      }
      50% { 
        box-shadow: 0 0 15px #f8d530, 0 0 30px #f8d530;
        filter: brightness(1.2);
      }
      75% { 
        box-shadow: 0 0 12px #fde14b, 0 0 24px #fde14b;
        filter: brightness(1.15);
      }
      100% { 
        box-shadow: 0 0 10px #fde14b, 0 0 20px #fde14b;
        filter: brightness(1.1);
      }
    }
    
    #logo {
      animation: subtleLogoGlow 3s ease-in-out infinite, floatLogo 4s ease-in-out infinite;
    }
    
    @keyframes floatLogo {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-8px) rotate(1deg) scale(1.01); }
    }
    
    #logo:hover {
      transform: scale(1.15) rotate(5deg);
      animation-duration: 1s;
    }
    
    /* Enhanced Header with Original Colors */
    .header-container { max-width:700px; margin-bottom:20px; position: relative;}
    
    .header-container h1 {
      margin:0;
      font-size:3.2rem;
      font-weight:900;
      letter-spacing:7px;
      font-family: 'Rajdhani', sans-serif;
      position: relative;
      display: inline-block;
    }
    
    /* BANDEALI with Original Golden Color + Special Highlight */
    .bandeali-highlight {
      color:#fde14b;
      text-shadow: 
        0 0 20px #fde14b, 
        0 0 30px #fde14b, 
        0 0 40px #fde14b,
        0 0 50px #ff6600;
      animation: bandealiSpecialGlow 2.5s ease-in-out infinite;
      position: relative;
      display: inline-block;
    }
    
    @keyframes bandealiSpecialGlow {
      0% { 
        text-shadow: 
          0 0 20px #fde14b, 
          0 0 30px #fde14b, 
          0 0 40px #fde14b,
          0 0 50px #ff6600;
        transform: scale(1);
      }
      50% { 
        text-shadow: 
          0 0 25px #fde14b, 
          0 0 40px #fde14b, 
          0 0 60px #fde14b,
          0 0 80px #ff6600;
        transform: scale(1.02);
      }
      100% { 
        text-shadow: 
          0 0 20px #fde14b, 
          0 0 30px #fde14b, 
          0 0 40px #fde14b,
          0 0 50px #ff6600;
        transform: scale(1);
      }
    }
    
    /* BANDEALI Extra Highlight Ring */
    .bandeali-highlight::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      background: radial-gradient(circle, rgba(255, 102, 0, 0.2), transparent);
      z-index: -1;
      filter: blur(15px);
      animation: bandealiRing 3s ease-in-out infinite;
    }
    
    @keyframes bandealiRing {
      0%, 100% { opacity: 0.2; transform: scale(0.9); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    
    .enterprises-text {
      color:#fde14b;
      text-shadow: 0 0 20px #fde14b, 0 0 40px #f8d530, 0 0 60px #fde14b;
      animation: textGlow 2s ease-in-out infinite alternate;
    }
    
    @keyframes textGlow {
      from { text-shadow: 0 0 20px #fde14b, 0 0 30px #f8d530, 0 0 40px #fde14b; }
      to { text-shadow: 0 0 30px #fde14b, 0 0 50px #f8d530, 0 0 70px #fde14b; }
    }
    
    .header-container h2 {
      margin:12px 0 0 0;
      font-size:2.2rem;
      color:#fbe74b;
      text-shadow:0 0 16px #fbe74b;
      font-weight:700;
      letter-spacing:5px;
      font-family: 'Rajdhani', sans-serif;
      animation: subtleGlow 3s ease-in-out infinite alternate;
    }
    
    @keyframes subtleGlow {
      from { text-shadow: 0 0 16px #fbe74b; }
      to { text-shadow: 0 0 25px #fbe74b, 0 0 35px #fbe74b; }
    }
    
    #instructions { 
      font-size:1.3rem; 
      max-width:500px; 
      margin:25px auto 35px auto; 
      color:#eee;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 500;
      animation: fadeInUp 1s ease-out;
      letter-spacing: 1px;
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* FIXED TREASURE BOX CONTAINER */
    #game-container { 
      display: grid !important; 
      grid-template-columns: repeat(3, 1fr) !important; 
      gap: 22px 20px !important; 
      justify-items: center !important; 
      width: 350px !important; 
      max-width: 95vw !important; 
      min-height: 400px !important; 
      margin: 0 auto 25px auto !important; 
      user-select: none !important;
      visibility: visible !important;
      opacity: 1 !important;
      z-index: 100 !important;
      position: relative !important;
    }
    
    /* FIXED BOX STYLES */
    .box { 
      width: 105px !important; 
      height: 135px !important; 
      background: linear-gradient(145deg, #1a1a2e, #16213e, #0f3460) !important; 
      border: 3px solid #fde14b !important; 
      border-radius: 22px !important; 
      box-shadow: 0 0 20px rgba(253, 225, 75, 0.3) inset, 0 8px 20px rgba(0,0,0,0.6) !important; 
      font-weight: 900 !important; 
      color: #fde14b !important; 
      font-size: 3rem !important; 
      display: flex !important; 
      flex-direction: column !important; 
      justify-content: center !important; 
      align-items: center !important; 
      cursor: pointer !important; 
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) !important; 
      outline: none !important; 
      position: relative !important;
      overflow: hidden !important;
      font-family: 'Rajdhani', sans-serif !important;
      visibility: visible !important;
      opacity: 1 !important;
      z-index: 10 !important;
    }
    
    /* Enhanced floating particles effect */
    .box::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(253, 225, 75, 0.15) 0%, transparent 70%);
      animation: floatingParticles 6s ease-in-out infinite;
      opacity: 0;
    }
    
    @keyframes floatingParticles {
      0%, 100% { transform: rotate(0deg) scale(0); opacity: 0; }
      50% { transform: rotate(180deg) scale(1.2); opacity: 0.8; }
    }
    
    /* Enhanced Hover Effect */
    @keyframes advancedPulse {
      0% { 
        box-shadow: 0 0 20px rgba(253, 225, 75, 0.3) inset, 0 8px 20px rgba(0,0,0,0.6), 0 0 15px #fde14b; 
        transform: translateY(0) scale(1) rotateX(0deg);
      }
      50% { 
        box-shadow: 0 0 35px rgba(253, 225, 75, 0.7) inset, 0 15px 35px rgba(0,0,0,0.8), 0 0 40px #fde14b; 
        transform: translateY(-10px) scale(1.06) rotateX(5deg);
      }
      100% { 
        box-shadow: 0 0 20px rgba(253, 225, 75, 0.3) inset, 0 8px 20px rgba(0,0,0,0.6), 0 0 15px #fde14b; 
        transform: translateY(0) scale(1) rotateX(0deg);
      }
    }
    
    .box:hover {
      animation: advancedPulse 1.8s ease-in-out infinite;
    }
    
    .box:hover::after {
      opacity: 1;
      animation-duration: 2s;
    }
    
    /* Enhanced Selected Box Animation */
    @keyframes epicSelected {
      0% { 
        border-color:#fff44c; 
        box-shadow: 0 0 50px #fff44c inset, 0 0 30px #fff44c, 0 15px 40px rgba(0,0,0,0.8);
        transform: scale(1.15) rotateY(0deg) rotateX(5deg);
      }
      25% { 
        border-color:#fde14b; 
        box-shadow: 0 0 60px #fde14b inset, 0 0 40px #fde14b, 0 20px 50px rgba(0,0,0,0.9);
        transform: scale(1.2) rotateY(90deg) rotateX(10deg);
      }
      50% { 
        border-color:#fff44c; 
        box-shadow: 0 0 70px #fff44c inset, 0 0 50px #fff44c, 0 25px 60px rgba(0,0,0,1.0);
        transform: scale(1.25) rotateY(180deg) rotateX(5deg);
      }
      75% { 
        border-color:#fde14b; 
        box-shadow: 0 0 60px #fde14b inset, 0 0 40px #fde14b, 0 20px 50px rgba(0,0,0,0.9);
        transform: scale(1.2) rotateY(270deg) rotateX(10deg);
      }
      100% { 
        border-color:#fff44c; 
        box-shadow: 0 0 50px #fff44c inset, 0 0 30px #fff44c, 0 15px 40px rgba(0,0,0,0.8);
        transform: scale(1.15) rotateY(360deg) rotateX(5deg);
      }
    }
    
    /* Enhanced spiral glow effect */
    .box.active::before {
      content: '';
      position: absolute;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      background: conic-gradient(from 0deg, transparent, #fde14b, transparent, #fff44c, transparent, #ffed4e, transparent);
      animation: spiralGlow 2.5s linear infinite;
      opacity: 0.9;
      z-index: -1;
    }
    
    @keyframes spiralGlow {
      0% { transform: rotate(0deg) scale(0.8); }
      100% { transform: rotate(360deg) scale(1.3); }
    }
    
    .box.active {
      animation: epicSelected 3.5s ease-in-out infinite;
      color:#4b3700;
      z-index: 50;
    }
    
    /* Enhanced explosive shake */
    @keyframes explosiveShake {
      0%, 100% { transform: translateX(0) rotateZ(0deg); }
      10% { transform: translateX(-10px) rotateZ(-3deg); }
      20% { transform: translateX(10px) rotateZ(3deg); }
      30% { transform: translateX(-8px) rotateZ(-2deg); }
      40% { transform: translateX(8px) rotateZ(2deg); }
      50% { transform: translateX(-6px) rotateZ(-1deg); }
      60% { transform: translateX(6px) rotateZ(1deg); }
      70% { transform: translateX(-4px) rotateZ(-0.5deg); }
      80% { transform: translateX(4px) rotateZ(0.5deg); }
      90% { transform: translateX(-2px) rotateZ(0deg); }
    }
    
    .box.locked { 
      filter:grayscale(1) brightness(0.5); 
      opacity:0.6; 
      cursor:default;
      animation: explosiveShake 1s ease-in-out;
    }
    
    /* Enhanced mega opening animation */
    @keyframes megaOpen {
      0% { 
        transform: scale(1) rotateY(0deg) rotateX(0deg); 
        background: linear-gradient(145deg, #1a1a2e, #16213e, #0f3460);
      }
      25% { 
        transform: scale(1.35) rotateY(90deg) rotateX(20deg); 
        background: linear-gradient(145deg, #fde14b, #fff44c, #f8d530);
      }
      50% { 
        transform: scale(1.45) rotateY(180deg) rotateX(35deg); 
        background: linear-gradient(145deg, #fff44c, #fde14b, #fff856);
      }
      75% { 
        transform: scale(1.35) rotateY(270deg) rotateX(20deg); 
        background: linear-gradient(145deg, #fde14b, #f8d530, #fff44c);
      }
      100% { 
        transform: scale(1.25) rotateY(360deg) rotateX(0deg); 
        background: linear-gradient(145deg, #fde14b, #fff856, #f8d530);
      }
    }
    
    .box.opened {
      background: linear-gradient(145deg, #fde14b, #fff856, #f8d530);
      color:#4b3700;
      cursor:default;
      filter:none;
      opacity:1;
      box-shadow: 0 0 70px #fee452, 0 0 120px rgba(255, 215, 0, 0.6);
      animation: megaOpen 1.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      transform: scale(1.25);
    }
    
    .box.disabled {background:#333; color:#666; border-color:#666; cursor:default; opacity:0.5;}
    .box img {max-width:48px;max-height:48px;margin-bottom:8px;filter:drop-shadow(0 0 8px #c1a834);}
    .box .text {font-size:1.1rem; user-select:none; text-align:center; line-height:1.2; font-weight: 700;}
    
    /* Enhanced Follow Button */
    #follow-first-btn { 
      display:none; 
      margin:0 auto 32px auto; 
      padding:20px 55px; 
      font-size:1.5rem; 
      background:linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045, #833ab4);
      background-size: 400% 400%;
      animation: gradientButton 3s ease infinite;
      border-radius:40px; 
      border:none; 
      color:#fff; 
      cursor:pointer; 
      font-weight:800; 
      box-shadow:0 0 35px rgba(253, 29, 29, 0.6), 0 8px 20px rgba(0,0,0,0.4); 
      letter-spacing:3px;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      position: relative;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
    }
    
    @keyframes gradientButton {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    #follow-first-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.6s ease;
    }
    
    #follow-first-btn:hover {
      transform: translateY(-6px) scale(1.06);
      box-shadow: 0 0 50px rgba(253, 29, 29, 0.9), 0 15px 35px rgba(0,0,0,0.5);
    }
    
    #follow-first-btn:hover::before {
      left: 100%;
    }
    
    /* Enhanced Reveal Button */
    #spin-button { 
      display:none; 
      margin:0 auto 32px auto; 
      padding:18px 50px; 
      font-size:1.4rem; 
      background: linear-gradient(45deg, #fde14b, #fff856, #f8d530, #fde14b); 
      background-size: 400% 400%;
      animation: goldenButton 2s ease infinite;
      border-radius:35px; 
      border:none; 
      color:#4b3700; 
      cursor:pointer; 
      font-weight:800; 
      box-shadow:0 0 30px rgba(253, 225, 75, 0.7); 
      letter-spacing:4px;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      position: relative;
      font-family: 'Rajdhani', sans-serif;
    }
    
    @keyframes goldenButton {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    #spin-button:not(:disabled) {
      animation: goldenButton 2s ease infinite, buttonFloat 3.5s ease-in-out infinite;
    }
    
    @keyframes buttonFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    
    #spin-button:hover { 
      transform: translateY(-10px) scale(1.1);
      box-shadow: 0 0 50px rgba(253, 225, 75, 0.9), 0 15px 40px rgba(0,0,0,0.4);
    }
    
    #spin-button:active {
      transform: translateY(-3px) scale(1.02);
    }
    
    #result-message { 
      font-size:1.7rem; 
      min-height:32px; 
      margin-bottom:20px; 
      color:#fde14b; 
      text-shadow:0 0 15px #fde14b;
      animation: messageGlow 2.5s ease-in-out infinite alternate;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      letter-spacing: 1px;
    }
    
    @keyframes messageGlow {
      from { text-shadow: 0 0 15px #fde14b; }
      to { text-shadow: 0 0 25px #fde14b, 0 0 40px #fde14b; }
    }
    
    #chances-counter { 
      font-size:1.5rem; 
      color:#ff6b6b; 
      margin-bottom:18px; 
      font-weight:700; 
      animation: counterPulse 1.2s ease-in-out infinite;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 2px;
    }
    
    @keyframes counterPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    
    /* Enhanced Popup Styles */
    #popup {position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.96);display:none;flex-direction:column;justify-content:center;align-items:center;color:white;font-size:2.4rem;padding:35px;z-index:2000;text-align:center;}
    #popup img {max-width:150px;margin-bottom:32px;}
    #popup .popup-text {margin-bottom:35px;color:#fde14b;font-weight:900;text-shadow:0 0 25px #fde14b; font-family: 'Rajdhani', sans-serif;}
    #popup .popup-follow-row { display: flex; align-items: center; gap: 16px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap;}
    
    /* Enhanced Try Again Button */
    #try-again-btn {
      margin-top: 25px;
      padding: 20px 50px;
      font-size: 1.5rem;
      background: linear-gradient(45deg, #ff6b6b, #ff5252, #ff4444, #ff6b6b);
      background-size: 400% 400%;
      animation: redButton 2s ease infinite;
      color: white;
      border: none;
      border-radius: 18px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 2px;
      box-shadow: 0 0 30px rgba(255, 107, 107, 0.6);
      transition: all 0.4s ease;
      font-family: 'Rajdhani', sans-serif;
    }
    
    @keyframes redButton {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    #try-again-btn:hover {
      transform: translateY(-4px) scale(1.06);
      box-shadow: 0 0 45px rgba(255, 107, 107, 0.9);
    }
    
    /* Enhanced Claim button */
    #popup #claim-btn {
      margin-top: 35px;
      font-size: 2.4rem;
      padding: 28px 90px;
      background: linear-gradient(45deg, #fde14b, #fff856, #f8d530, #fde14b);
      background-size: 400% 400%;
      animation: epicClaimButton 2s ease infinite;
      border-radius: 50px;
      border: none;
      color: #4b3700;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 3px;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      position: relative;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
    }
    
    @keyframes epicClaimButton {
      0% { 
        background-position: 0% 50%; 
        box-shadow: 0 0 25px #fde14b, 0 0 50px rgba(253, 225, 75, 0.6);
      }
      50% { 
        background-position: 100% 50%; 
        box-shadow: 0 0 40px #fff856, 0 0 80px rgba(255, 248, 86, 0.8);
      }
      100% { 
        background-position: 0% 50%; 
        box-shadow: 0 0 25px #fde14b, 0 0 50px rgba(253, 225, 75, 0.6);
      }
    }
    
    #popup #claim-btn:hover {
      transform: translateY(-6px) scale(1.1);
      box-shadow: 0 0 60px #fde14b, 0 0 100px rgba(253, 225, 75, 0.9);
    }
    
    canvas#fireworks { position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; display:none; z-index:2100;}
    
    @media (max-width:600px){
      #logo {max-width:125px;margin:20px auto 10px auto;}
      .header-container h1 {font-size:2.4rem; letter-spacing: 4px;}
      .header-container h2 {font-size:1.7rem; letter-spacing: 3px;}
      #instructions {font-size:1.2rem;margin-bottom:28px;padding:0 10px;}
      #game-container {width:310px !important;gap:16px 14px !important;}
      .box {width:88px !important;height:118px !important;font-size:2.4rem !important;}
      #follow-first-btn {padding:16px 38px;font-size:1.3rem;}
      #spin-button {padding:16px 35px;font-size:1.3rem;}
      #result-message {font-size:1.5rem;margin-bottom:16px;}
      #chances-counter {font-size:1.3rem;}
      #popup {font-size:2rem;padding:25px;}
      #popup img {max-width:110px;margin-bottom:25px;}
      #popup #claim-btn {
        font-size:1.8rem;
        padding:20px 50px;
      }
      #try-again-btn {
        padding: 16px 40px;
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <!-- Hidden Backend Tracker (Not visible to users) -->
  <div id="hidden-tracker"></div>

  <img id="logo" src="Logo.png" alt="Bandeali Enterprises Logo" />
  <div class="header-container">
    <h1><span class="bandeali-highlight">Bandeali</span> <span class="enterprises-text">Enterprises</span></h1>
    <h2>Treasure Box Game</h2>
  </div>
  <div id="instructions">Choose a treasure box below and test your luck!</div>
  <div id="chances-counter"></div>
  <div id="game-container"></div>
  <button id="follow-first-btn">📸 Follow Us to Reveal</button>
  <button id="spin-button">Reveal All</button>
  <div id="result-message"></div>
  <div id="popup" tabindex="-1"></div>
  <canvas id="fireworks"></canvas>

  <script>
    const prizes = [
      { win: true, text: "🔥 10% OFF" },
      { win: false, text: "Better luck!" },
      { win: true, text: "🎁 15% OFF" },
      { win: false, text: "Better luck!" },
      { win: true, text: "💸 20% OFF" },
      { win: false, text: "Better luck!" },
      { win: true, text: "🎉 ₹30 OFF" },
      { win: true, text: "🎧 Free Earphones" },
      { win: true, text: "💵 ₹50 Cashback" }
    ];
    
    const gameContainer = document.getElementById('game-container');
    const followFirstBtn = document.getElementById('follow-first-btn');
    const spinButton = document.getElementById('spin-button');
    const resultMessage = document.getElementById('result-message');
    const chancesCounter = document.getElementById('chances-counter');
    const popup = document.getElementById('popup');
    const fireworksCanvas = document.getElementById('fireworks');
    const ctx = fireworksCanvas.getContext('2d');
    
    let selectedIndex = null;
    let boxes = [];
    let gameState = 'selection';
    let chancesLeft = 3;
    let hasFollowed = false;
    let usedBoxes = [];
    
    // 🔥 SIMPLIFIED HIDDEN FOLLOWER TRACKER 🔥
    class HiddenFollowerTracker {
      constructor() {
        this.analytics = {
          totalViews: 0,
          gameStarts: 0,
          followClicks: 0,
          newFollowers: 0,
          conversionRate: 0
        };
        this.initializeTracker();
        console.log('🕵️‍♂️ Hidden Follower Tracker Active - Check Console for Logs');
      }
      
      initializeTracker() {
        this.analytics.totalViews++;
        this.logEvent('tracker_initialized', {
          timestamp: new Date().toISOString(),
          userAgent: navigator.userAgent,
          referrer: document.referrer
        });
        
        // Track follow button clicks
        document.addEventListener('click', (event) => {
          if (event.target.id === 'follow-first-btn') {
            this.analytics.followClicks++;
            this.logEvent('follow_button_clicked');
            this.detectFollowCompletion();
          }
        });
      }
      
      detectFollowCompletion() {
        let windowFocusTimer;
        
        window.addEventListener('blur', () => {
          windowFocusTimer = Date.now();
        });
        
        window.addEventListener('focus', () => {
          const timeAway = Date.now() - windowFocusTimer;
          
          if (timeAway > 8000) { // User was away for 8+ seconds
            this.handleNewFollower();
          }
        });
      }
      
      handleNewFollower() {
        this.analytics.newFollowers++;
        this.calculateConversionRate();
        
        this.logEvent('new_follower_detected', {
          total: this.analytics.newFollowers,
          conversionRate: this.analytics.conversionRate,
          timestamp: new Date().toISOString()
        });
      }
      
      calculateConversionRate() {
        if (this.analytics.followClicks > 0) {
          this.analytics.conversionRate = (this.analytics.newFollowers / this.analytics.followClicks) * 100;
        }
      }
      
      logEvent(eventType, data = {}) {
        const logEntry = {
          event: eventType,
          timestamp: new Date().toISOString(),
          analytics: this.analytics,
          ...data
        };
        
        console.log(`🔍 [TRACKER] ${eventType}:`, logEntry);
        
        // Store in localStorage
        const logs = JSON.parse(localStorage.getItem('followerTrackerLogs') || '[]');
        logs.push(logEntry);
        
        if (logs.length > 50) {
          logs.splice(0, logs.length - 50);
        }
        
        localStorage.setItem('followerTrackerLogs', JSON.stringify(logs));
      }
      
      getAnalytics() {
        return {
          ...this.analytics,
          logs: JSON.parse(localStorage.getItem('followerTrackerLogs') || '[]')
        };
      }
    }
    
    // Initialize hidden tracker
    const hiddenTracker = new HiddenFollowerTracker();
    window._ht = hiddenTracker; // For console access
    
    function shuffle(array) {
      let currentIndex = array.length;
      while (currentIndex !== 0) {
        const randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
      }
      return array;
    }
    
    function updateChancesDisplay() {
      if (chancesLeft < 3) {
        chancesCounter.textContent = `🎯 Chances Left: ${chancesLeft}`;
        chancesCounter.style.display = 'block';
      } else {
        chancesCounter.style.display = 'none';
      }
    }
    
    function createBoxes() {
      console.log('Creating treasure boxes...'); // Debug log
      
      gameContainer.innerHTML = '';
      resultMessage.textContent = '';
      selectedIndex = null;
      boxes = [];
      gameState = 'selection';
      followFirstBtn.style.display = 'none';
      spinButton.style.display = 'none';
      
      // Track game start
      hiddenTracker.analytics.gameStarts++;
      hiddenTracker.logEvent('game_started');
      
      const shuffledPrizes = shuffle([...prizes]);
      
      for (let i = 0; i < shuffledPrizes.length; i++) {
        const box = document.createElement('div');
        box.className = 'box';
        
        if (usedBoxes.includes(i)) {
          box.classList.add('disabled');
        }
        
        box.setAttribute('tabindex', '0');
        box.setAttribute('role', 'button');
        box.setAttribute('aria-label', 'Treasure box. Click to select.');
        box.dataset.index = i;
        box.innerHTML = `<span>?</span>`;
        box.title = "Click to select this treasure box";
        
        // Add event listeners
        box.addEventListener('click', onBoxSelect);
        box.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            onBoxSelect.call(box);
          }
        });
        
        gameContainer.appendChild(box);
        boxes.push({ el: box, prize: shuffledPrizes[i] });
        
        console.log(`Box ${i} created:`, box); // Debug log
        
        // Entrance animation with immediate visibility
        box.style.opacity = '0';
        box.style.transform = 'translateY(60px) rotateX(30deg)';
        
        setTimeout(() => {
          box.style.transition = 'all 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
          box.style.opacity = '1';
          box.style.transform = 'translateY(0) rotateX(0deg)';
        }, i * 100 + 100); // Faster animation start
      }
      
      console.log('Total boxes created:', boxes.length); // Debug log
      updateChancesDisplay();
    }
    
    function onBoxSelect() {
      if (selectedIndex !== null || gameState !== 'selection') return;
      if (usedBoxes.includes(Number(this.dataset.index))) return;
      
      selectedIndex = Number(this.dataset.index);
      gameState = 'follow';
      
      console.log('Box selected:', selectedIndex); // Debug log
      
      // Track box selection
      hiddenTracker.logEvent('box_selected', {
        boxIndex: selectedIndex,
        prize: boxes[selectedIndex].prize
      });
      
      boxes.forEach((box, idx) => {
        if (idx !== selectedIndex) {
          box.el.classList.add('locked');
          box.el.setAttribute('aria-pressed', 'false');
          box.el.tabIndex = -1;
          setTimeout(() => {
            box.el.style.animation = 'explosiveShake 1s ease-in-out';
          }, idx * 90);
        } else {
          box.el.classList.remove('locked');
          box.el.classList.add('active');
          box.el.setAttribute('aria-pressed', 'true');
          box.el.tabIndex = 0;
          box.el.focus();
          createEpicParticleBurst(box.el);
        }
      });
      
      if (!hasFollowed) {
        followFirstBtn.style.display = 'block';
        resultMessage.textContent = 'Follow us on Instagram to reveal your treasure! 📸✨';
      } else {
        showRevealButton();
      }
    }
    
    function createEpicParticleBurst(box) {
      for (let i = 0; i < 35; i++) {
        const particle = document.createElement('div');
        particle.style.position = 'absolute';
        particle.style.width = '8px';
        particle.style.height = '8px';
        particle.style.background = `hsl(${Math.random() * 60 + 30}, 100%, 65%)`;
        particle.style.borderRadius = '50%';
        particle.style.pointerEvents = 'none';
        particle.style.zIndex = '1500';
        particle.style.boxShadow = `0 0 10px ${particle.style.background}`;
        
        const boxRect = box.getBoundingClientRect();
        particle.style.left = boxRect.left + boxRect.width/2 + 'px';
        particle.style.top = boxRect.top + boxRect.height/2 + 'px';
        
        document.body.appendChild(particle);
        
        const angle = (i / 35) * Math.PI * 2;
        const distance = 90 + Math.random() * 90;
        const finalX = boxRect.left + boxRect.width/2 + Math.cos(angle) * distance;
        const finalY = boxRect.top + boxRect.height/2 + Math.sin(angle) * distance;
        
        particle.animate([
          { 
            transform: 'translate(0, 0) scale(1) rotate(0deg)', 
            opacity: 1 
          },
          { 
            transform: `translate(${finalX - (boxRect.left + boxRect.width/2)}px, ${finalY - (boxRect.top + boxRect.height/2)}px) scale(0) rotate(900deg)`, 
            opacity: 0 
          }
        ], {
          duration: 1400 + Math.random() * 500,
          easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
        }).onfinish = () => {
          particle.remove();
        };
      }
    }
    
    function showRevealButton() {
      followFirstBtn.style.display = 'none';
      spinButton.style.display = 'block';
      spinButton.disabled = false;
      gameState = 'reveal';
      resultMessage.textContent = 'Click "Reveal All" to see your treasure! 🎁✨';
    }
    
    followFirstBtn.addEventListener('click', () => {
      hiddenTracker.logEvent('follow_button_clicked');
      window.open('https://www.instagram.com/bandeali_enterprises', '_blank');
      
      setTimeout(() => {
        hasFollowed = true;
        showRevealButton();
        resultMessage.textContent = '🎉 Thank you for following! Now reveal your treasure!';
        hiddenTracker.logEvent('follow_completed');
      }, 1200);
    });
    
    spinButton.addEventListener('click', () => {
      if (gameState === 'reveal') {
        revealBoxes();
      }
    });
    
    function revealBoxes() {
      hiddenTracker.logEvent('boxes_revealed', {
        selectedPrize: boxes[selectedIndex].prize
      });
      
      boxes.forEach((box, idx) => {
        setTimeout(() => {
          box.el.classList.remove('locked', 'active');
          box.el.classList.add('opened');
          box.el.tabIndex = -1;
          box.el.innerHTML = '';
          
          if (box.prize.win) {
            const img = document.createElement('img');
            img.src = 'treasure.png';
            img.alt = 'Treasure box image';
            img.className = 'chest-img';
            box.el.appendChild(img);
            const textDiv = document.createElement('div');
            textDiv.className = 'text';
            textDiv.textContent = box.prize.text;
            box.el.appendChild(textDiv);
          } else {
            const textDiv = document.createElement('div');
            textDiv.className = 'text';
            textDiv.textContent = box.prize.text;
            box.el.appendChild(textDiv);
          }
        }, idx * 220);
      });
      
      spinButton.style.display = 'none';
      gameState = 'finished';
      
      setTimeout(() => {
        showResultPopup(boxes[selectedIndex].prize);
      }, boxes.length * 220 + 900);
    }
    
    function showResultPopup(prize) {
      usedBoxes.push(selectedIndex);
      
      hiddenTracker.logEvent('result_shown', {
        prize: prize,
        isWinner: prize.win
      });
      
      if (prize.win) {
        popup.innerHTML = `
          <img id="popup-img" src="treasure.png" alt="Treasure Box" />
          <div class="popup-text">🎉 CONGRATULATIONS! 🎉<br><br>${prize.text}</div>
          <button id="claim-btn">✨ CLAIM YOUR PRIZE ✨</button>
        `;
        startFireworks();
      } else {
        chancesLeft--;
        if (chancesLeft > 0) {
          popup.innerHTML = `
            <div class="popup-text">😔 ${prize.text}<br><br>🎯 You have ${chancesLeft} more chance${chancesLeft > 1 ? 's' : ''}!</div>
            <button id="try-again-btn">🔄 Try Again</button>
          `;
        } else {
          popup.innerHTML = `
            <div class="popup-text">😞 Bad luck today!<br><br>🌟 Try again tomorrow for better luck!</div>
            <button id="try-again-btn">🎮 Start New Game</button>
          `;
        }
      }
      
      popup.style.display = 'flex';
      
      const claimBtn = document.getElementById('claim-btn');
      const tryAgainBtn = document.getElementById('try-again-btn');
      
      if (claimBtn) {
        claimBtn.addEventListener('click', function () {
          hiddenTracker.logEvent('prize_claimed', { prize: prize });
          popup.style.display = 'none';
          stopFireworks();
          resetGame();
        });
      }
      
      if (tryAgainBtn) {
        tryAgainBtn.addEventListener('click', function () {
          hiddenTracker.logEvent('try_again_clicked');
          popup.style.display = 'none';
          if (chancesLeft > 0) {
            createBoxes();
            document.getElementById('instructions').textContent = 'Choose another treasure box! 🎯';
          } else {
            resetGame();
          }
        });
      }
      
      popup.focus();
    }
    
    function resetGame() {
      chancesLeft = 3;
      hasFollowed = false;
      usedBoxes = [];
      selectedIndex = null;
      gameState = 'selection';
      
      hiddenTracker.logEvent('game_reset');
      
      createBoxes();
      document.getElementById('instructions').textContent = 'Choose a treasure box below and test your luck! 🍀';
    }
    
    // Fireworks code (same as before)
    let fireworks = [];
    let fireworksAnimation;
    
    class Firework {
      constructor() {
        this.x = Math.random() * fireworksCanvas.width;
        this.y = fireworksCanvas.height + 10;
        this.targetY = Math.random() * fireworksCanvas.height / 2;
        this.vy = -(9 + Math.random() * 5);
        this.exploded = false;
        this.particles = [];
        this.color = `hsl(${Math.random() * 360}, 100%, 65%)`;
        this.size = 3 + Math.random() * 2;
      }
      
      update() {
        if (!this.exploded) {
          this.y += this.vy;
          this.vy += 0.18;
          if (this.vy >= 0) {
            this.exploded = true;
            for (let i = 0; i < 36; i++) {
              const angle = (2 * Math.PI / 36) * i;
              this.particles.push({
                x: this.x,
                y: this.y,
                vx: Math.cos(angle) * (4 + Math.random() * 4),
                vy: Math.sin(angle) * (4 + Math.random() * 4),
                alpha: 1,
                color: this.color,
                size: 1.5 + Math.random() * 2.5,
              });
            }
          }
        } else {
          this.particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.06;
            p.alpha -= 0.018;
            p.vx *= 0.988;
          });
          this.particles = this.particles.filter(p => p.alpha > 0);
        }
      }
      
      draw(ctx) {
        if (!this.exploded) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
          ctx.fillStyle = this.color;
          ctx.shadowBlur = 12;
          ctx.shadowColor = this.color;
          ctx.fill();
          ctx.shadowBlur = 0;
        } else {
          this.particles.forEach(p => {
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, 2 * Math.PI);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 6;
            ctx.shadowColor = p.color;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
          });
        }
      }
    }
    
    function startFireworks() {
      fireworksCanvas.width = window.innerWidth;
      fireworksCanvas.height = window.innerHeight;
      fireworks = [];
      fireworksAnimation = setInterval(() => {
        if (fireworks.length < 45) fireworks.push(new Firework());
      }, 140);
      renderFireworks();
      fireworksCanvas.style.display = 'block';
    }
    
    function stopFireworks() {
      clearInterval(fireworksAnimation);
      fireworks = [];
      ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
      fireworksCanvas.style.display = 'none';
    }
    
    function renderFireworks() {
      ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
      fireworks.forEach(fw => {
        fw.update();
        fw.draw(ctx);
      });
      fireworks = fireworks.filter(fw => fw.particles.length > 0 || !fw.exploded);
      
      if (fireworksCanvas.style.display === 'block') {
        requestAnimationFrame(renderFireworks);
      }
    }
    
    window.addEventListener('resize', () => {
      fireworksCanvas.width = window.innerWidth;
      fireworksCanvas.height = window.innerHeight;
    });
    
    // Initialize game
    window.onload = () => {
      console.log('Initializing treasure box game...'); // Debug log
      createBoxes();
      document.getElementById('instructions').textContent = 'Choose a treasure box below and test your luck! 🍀';
      
      hiddenTracker.logEvent('page_loaded', {
        timestamp: new Date().toISOString()
      });
    };
    
    // Force create boxes if onload doesn't work
    setTimeout(() => {
      if (boxes.length === 0) {
        console.log('Force creating boxes...'); // Debug log
        createBoxes();
      }
    }, 1000);
  </script>
</body>
