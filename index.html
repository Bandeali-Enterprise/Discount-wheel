<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎯 Bandeali Enterprises - Ultimate Treasure Hunt 🎯</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
    
    :root {
      --primary-gold: #ffd700;
      --secondary-gold: #ffed4e;
      --dark-gold: #b8860b;
      --neon-blue: #00ffff;
      --neon-pink: #ff00ff;
      --neon-green: #39ff14;
      --bandeali-special: #ff6600; /* Special color for BANDEALI */
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body { 
      background: linear-gradient(45deg, #0a0a0a, #1a0033, #330066, #0066cc, #00ccff);
      background-size: 1000% 1000%;
      animation: epicBackground 20s ease infinite;
      font-family: 'Orbitron', sans-serif; 
      color: white; 
      min-height: 100vh; 
      margin: 0; 
      padding: 0; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      user-select: none; 
      text-align: center;
      overflow-x: hidden;
      position: relative;
    }
    
    @keyframes epicBackground {
      0% { background-position: 0% 50%; }
      25% { background-position: 100% 0%; }
      50% { background-position: 100% 100%; }
      75% { background-position: 0% 100%; }
      100% { background-position: 0% 50%; }
    }
    
    /* Animated Background Particles */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, transparent),
        radial-gradient(2px 2px at 40px 70px, var(--neon-blue), transparent),
        radial-gradient(1px 1px at 90px 40px, var(--neon-pink), transparent),
        radial-gradient(1px 1px at 130px 80px, var(--neon-green), transparent),
        radial-gradient(2px 2px at 160px 30px, var(--primary-gold), transparent);
      background-repeat: repeat;
      background-size: 200px 100px;
      animation: starField 20s linear infinite;
      opacity: 0.6;
      z-index: -1;
    }
    
    @keyframes starField {
      0% { transform: translateY(0); }
      100% { transform: translateY(-100px); }
    }
    
    /* MEGA COOL LOGO */
    #logo { 
      max-width: 180px; 
      margin: 30px auto 15px auto; 
      user-select: none;
      border-radius: 50%; 
      display: block; 
      padding: 10px;
      transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      position: relative;
      overflow: hidden;
      z-index: 100;
    }
    
    /* ULTIMATE RAINBOW GLOW */
    @keyframes ultimateLogoGlow {
      0% { 
        box-shadow: 
          0 0 20px var(--neon-blue),
          0 0 40px var(--neon-blue),
          0 0 60px var(--neon-blue),
          0 0 80px var(--neon-blue),
          inset 0 0 20px rgba(0, 255, 255, 0.1);
        filter: hue-rotate(0deg) brightness(1.2);
        transform: translateY(0px) rotate(0deg) scale(1);
      }
      25% { 
        box-shadow: 
          0 0 25px var(--neon-green),
          0 0 50px var(--neon-green),
          0 0 75px var(--neon-green),
          0 0 100px var(--neon-green),
          inset 0 0 25px rgba(57, 255, 20, 0.1);
        filter: hue-rotate(90deg) brightness(1.4);
        transform: translateY(-5px) rotate(2deg) scale(1.05);
      }
      50% { 
        box-shadow: 
          0 0 30px var(--neon-pink),
          0 0 60px var(--neon-pink),
          0 0 90px var(--neon-pink),
          0 0 120px var(--neon-pink),
          inset 0 0 30px rgba(255, 0, 255, 0.1);
        filter: hue-rotate(180deg) brightness(1.6);
        transform: translateY(-10px) rotate(-2deg) scale(1.1);
      }
      75% { 
        box-shadow: 
          0 0 25px var(--primary-gold),
          0 0 50px var(--primary-gold),
          0 0 75px var(--primary-gold),
          0 0 100px var(--primary-gold),
          inset 0 0 25px rgba(255, 215, 0, 0.1);
        filter: hue-rotate(270deg) brightness(1.4);
        transform: translateY(-5px) rotate(1deg) scale(1.05);
      }
      100% { 
        box-shadow: 
          0 0 20px var(--neon-blue),
          0 0 40px var(--neon-blue),
          0 0 60px var(--neon-blue),
          0 0 80px var(--neon-blue),
          inset 0 0 20px rgba(0, 255, 255, 0.1);
        filter: hue-rotate(360deg) brightness(1.2);
        transform: translateY(0px) rotate(0deg) scale(1);
      }
    }
    
    #logo {
      animation: ultimateLogoGlow 4s ease-in-out infinite;
    }
    
    #logo:hover {
      transform: scale(1.25) rotate(10deg) !important;
      animation-duration: 0.5s !important;
      cursor: pointer;
    }
    
    /* EPIC HEADERS */
    .header-container { 
      max-width: 700px; 
      margin-bottom: 20px;
      position: relative;
    }
    
    /* SPECIAL BANDEALI HIGHLIGHT */
    .header-container h1 {
      margin: 0;
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 8px;
      position: relative;
      animation: titleFloat 6s ease-in-out infinite;
    }
    
    /* Split BANDEALI and ENTERPRISES for different effects */
    .bandeali-text {
      background: linear-gradient(45deg, var(--bandeali-special), #ff3300, #ff9900, var(--primary-gold));
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: bandealiSpecialGlow 2s ease-in-out infinite;
      text-shadow: 0 0 30px var(--bandeali-special), 0 0 60px var(--bandeali-special);
      position: relative;
      display: inline-block;
    }
    
    .enterprises-text {
      background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink), var(--primary-gold));
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: epicTextGradient 3s ease-in-out infinite;
    }
    
    @keyframes bandealiSpecialGlow {
      0% { 
        background-position: 0% 50%; 
        filter: drop-shadow(0 0 20px var(--bandeali-special)) drop-shadow(0 0 40px var(--bandeali-special));
        transform: scale(1);
      }
      50% { 
        background-position: 100% 50%; 
        filter: drop-shadow(0 0 40px var(--bandeali-special)) drop-shadow(0 0 80px var(--bandeali-special));
        transform: scale(1.05);
      }
      100% { 
        background-position: 0% 50%; 
        filter: drop-shadow(0 0 20px var(--bandeali-special)) drop-shadow(0 0 40px var(--bandeali-special));
        transform: scale(1);
      }
    }
    
    @keyframes epicTextGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    @keyframes titleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    
    /* BANDEALI Aura Effect */
    .bandeali-text::before {
      content: '';
      position: absolute;
      top: -15px;
      left: -15px;
      right: -15px;
      bottom: -15px;
      background: radial-gradient(circle, var(--bandeali-special), transparent);
      z-index: -1;
      filter: blur(25px);
      opacity: 0.6;
      animation: bandealiAura 3s ease-in-out infinite;
    }
    
    @keyframes bandealiAura {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }
    
    .header-container h2 {
      margin: 10px 0 0 0;
      font-size: 2.2rem;
      color: var(--secondary-gold);
      font-weight: 700;
      letter-spacing: 5px;
      text-shadow: 
        0 0 10px var(--secondary-gold),
        0 0 20px var(--secondary-gold),
        0 0 30px var(--secondary-gold);
      animation: subtitlePulse 4s ease-in-out infinite;
    }
    
    @keyframes subtitlePulse {
      0%, 100% { text-shadow: 0 0 10px var(--secondary-gold), 0 0 20px var(--secondary-gold); }
      50% { text-shadow: 0 0 20px var(--secondary-gold), 0 0 40px var(--secondary-gold), 0 0 60px var(--secondary-gold); }
    }
    
    /* INSTRUCTIONS WITH TYPEWRITER EFFECT */
    #instructions { 
      font-size: 1.4rem; 
      max-width: 500px; 
      margin: 25px auto 35px auto; 
      color: var(--neon-blue);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 500;
      text-shadow: 0 0 10px var(--neon-blue);
      animation: instructionGlow 3s ease-in-out infinite alternate;
    }
    
    @keyframes instructionGlow {
      from { text-shadow: 0 0 10px var(--neon-blue); }
      to { text-shadow: 0 0 20px var(--neon-blue), 0 0 30px var(--neon-blue); }
    }
    
    #game-container { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 25px 20px; 
      justify-items: center; 
      width: 360px; 
      max-width: 95vw; 
      min-height: 400px; 
      margin-bottom: 30px; 
      user-select: none;
      perspective: 1000px;
    }
    
    /* ULTIMATE BOX DESIGN */
    .box { 
      width: 110px; 
      height: 140px; 
      background: linear-gradient(145deg, #1a1a2e, #16213e, #0f3460, #533483); 
      border: 4px solid var(--primary-gold); 
      border-radius: 25px; 
      font-weight: 900; 
      color: var(--primary-gold); 
      font-size: 3rem; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      cursor: pointer; 
      transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
      outline: none; 
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
    }
    
    /* ANIMATED BORDER GLOW */
    .box::before {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink), var(--neon-green), var(--primary-gold));
      background-size: 400% 400%;
      border-radius: 25px;
      z-index: -1;
      animation: borderFlow 4s linear infinite;
      opacity: 0;
    }
    
    @keyframes borderFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    /* FLOATING PARTICLES */
    .box::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.3) 2px, transparent 2px),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 255, 0.3) 1px, transparent 1px),
        radial-gradient(circle at 40% 60%, rgba(255, 0, 255, 0.3) 1px, transparent 1px);
      animation: floatingDots 8s ease-in-out infinite;
      opacity: 0;
    }
    
    @keyframes floatingDots {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0; }
      50% { transform: translateY(-10px) rotate(180deg); opacity: 1; }
    }
    
    /* MEGA HOVER EFFECT */
    .box:hover {
      transform: translateY(-15px) rotateX(15deg) rotateY(15deg) scale(1.1);
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.8),
        0 0 30px var(--primary-gold),
        0 0 60px var(--neon-blue);
    }
    
    .box:hover::before {
      opacity: 1;
    }
    
    .box:hover::after {
      opacity: 1;
      animation-duration: 3s;
    }
    
    /* ULTIMATE SELECTED ANIMATION */
    @keyframes ultimateSelected {
      0% { 
        transform: rotateY(0deg) scale(1.2);
        box-shadow: 
          0 0 30px var(--primary-gold),
          0 0 60px var(--neon-blue),
          0 20px 40px rgba(0, 0, 0, 0.8);
      }
      25% { 
        transform: rotateY(90deg) scale(1.25);
        box-shadow: 
          0 0 40px var(--neon-green),
          0 0 80px var(--neon-pink),
          0 25px 50px rgba(0, 0, 0, 0.9);
      }
      50% { 
        transform: rotateY(180deg) scale(1.3);
        box-shadow: 
          0 0 50px var(--neon-pink),
          0 0 100px var(--primary-gold),
          0 30px 60px rgba(0, 0, 0, 1.0);
      }
      75% { 
        transform: rotateY(270deg) scale(1.25);
        box-shadow: 
          0 0 40px var(--neon-blue),
          0 0 80px var(--neon-green),
          0 25px 50px rgba(0, 0, 0, 0.9);
      }
      100% { 
        transform: rotateY(360deg) scale(1.2);
        box-shadow: 
          0 0 30px var(--primary-gold),
          0 0 60px var(--neon-blue),
          0 20px 40px rgba(0, 0, 0, 0.8);
      }
    }
    
    /* SPIRAL ENERGY RING */
    .box.active::before {
      opacity: 1 !important;
      animation: borderFlow 1s linear infinite, spiralEnergy 3s ease-in-out infinite;
    }
    
    @keyframes spiralEnergy {
      0% { transform: rotate(0deg) scale(1); }
      100% { transform: rotate(360deg) scale(1.2); }
    }
    
    .box.active {
      animation: ultimateSelected 4s ease-in-out infinite;
      color: #1a0033;
      z-index: 50;
    }
    
    .box.active::after {
      opacity: 1 !important;
      animation: energyPulse 2s ease-in-out infinite;
    }
    
    @keyframes energyPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.5); opacity: 1; }
    }
    
    /* EXPLOSIVE SHAKE */
    @keyframes megaShake {
      0% { transform: translateX(0) rotateZ(0deg); }
      10% { transform: translateX(-12px) rotateZ(-3deg); }
      20% { transform: translateX(12px) rotateZ(3deg); }
      30% { transform: translateX(-10px) rotateZ(-2deg); }
      40% { transform: translateX(10px) rotateZ(2deg); }
      50% { transform: translateX(-8px) rotateZ(-1deg); }
      60% { transform: translateX(8px) rotateZ(1deg); }
      70% { transform: translateX(-6px) rotateZ(-0.5deg); }
      80% { transform: translateX(6px) rotateZ(0.5deg); }
      90% { transform: translateX(-2px) rotateZ(0deg); }
      100% { transform: translateX(0) rotateZ(0deg); }
    }
    
    .box.locked { 
      filter: grayscale(1) brightness(0.4); 
      opacity: 0.5; 
      cursor: not-allowed;
      animation: megaShake 1s ease-in-out;
    }
    
    /* ULTIMATE OPENING ANIMATION */
    @keyframes ultimateOpen {
      0% { 
        transform: scale(1) rotateY(0deg) rotateX(0deg); 
        background: linear-gradient(145deg, #1a1a2e, #16213e, #0f3460, #533483);
      }
      25% { 
        transform: scale(1.4) rotateY(90deg) rotateX(20deg); 
        background: linear-gradient(145deg, var(--primary-gold), var(--secondary-gold), var(--neon-blue));
      }
      50% { 
        transform: scale(1.5) rotateY(180deg) rotateX(40deg); 
        background: linear-gradient(145deg, var(--neon-pink), var(--neon-green), var(--primary-gold));
      }
      75% { 
        transform: scale(1.4) rotateY(270deg) rotateX(20deg); 
        background: linear-gradient(145deg, var(--neon-blue), var(--primary-gold), var(--secondary-gold));
      }
      100% { 
        transform: scale(1.3) rotateY(360deg) rotateX(0deg); 
        background: linear-gradient(145deg, var(--primary-gold), var(--secondary-gold), #ffed4e);
      }
    }
    
    .box.opened {
      background: linear-gradient(145deg, var(--primary-gold), var(--secondary-gold), #ffed4e);
      color: #1a0033;
      cursor: default;
      filter: none;
      opacity: 1;
      box-shadow: 
        0 0 80px var(--primary-gold), 
        0 0 120px rgba(255, 215, 0, 0.6),
        0 30px 60px rgba(0, 0, 0, 0.8);
      animation: ultimateOpen 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      transform: scale(1.3);
      z-index: 20;
    }
    
    .box img {max-width:50px;max-height:50px;margin-bottom:8px;filter:drop-shadow(0 0 10px #000);}
    .box .text {font-size:1.1rem; user-select:none; text-align:center; line-height:1.2; font-weight: 700;}
    
    /* ULTIMATE FOLLOW BUTTON */
    #follow-first-btn { 
      display: none; 
      margin: 0 auto 35px auto; 
      padding: 20px 55px; 
      font-size: 1.6rem; 
      background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045, #f56040, #833ab4);
      background-size: 500% 500%;
      animation: ultimateButtonGradient 3s ease infinite;
      border-radius: 50px; 
      border: none; 
      color: #fff; 
      cursor: pointer; 
      font-weight: 900; 
      box-shadow: 
        0 0 40px rgba(253, 29, 29, 0.6), 
        0 10px 30px rgba(0,0,0,0.5),
        inset 0 0 20px rgba(255,255,255,0.1); 
      letter-spacing: 4px;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      position: relative;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
    }
    
    @keyframes ultimateButtonGradient {
      0% { background-position: 0% 50%; }
      25% { background-position: 100% 0%; }
      50% { background-position: 100% 100%; }
      75% { background-position: 0% 100%; }
      100% { background-position: 0% 50%; }
    }
    
    #follow-first-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.6s ease;
    }
    
    #follow-first-btn:hover {
      transform: translateY(-8px) scale(1.08);
      box-shadow: 
        0 0 60px rgba(253, 29, 29, 0.8), 
        0 15px 40px rgba(0,0,0,0.6),
        inset 0 0 30px rgba(255,255,255,0.2);
    }
    
    #follow-first-btn:hover::before {
      left: 100%;
    }
    
    /* ULTIMATE REVEAL BUTTON */
    #spin-button { 
      display: none; 
      margin: 0 auto 35px auto; 
      padding: 18px 50px; 
      font-size: 1.5rem; 
      background: linear-gradient(45deg, var(--primary-gold), var(--secondary-gold), #ffed4e, var(--neon-blue), var(--primary-gold)); 
      background-size: 500% 500%;
      animation: ultimateGoldenButton 2.5s ease infinite, revealFloat 4s ease-in-out infinite;
      border-radius: 40px; 
      border: 4px solid var(--primary-gold);
      color: #1a0033; 
      cursor: pointer; 
      font-weight: 900; 
      box-shadow: 
        0 0 50px var(--primary-gold), 
        0 10px 30px rgba(0,0,0,0.6),
        inset 0 0 20px rgba(255,255,255,0.2); 
      letter-spacing: 5px;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      position: relative;
      font-family: 'Rajdhani', sans-serif;
    }
    
    @keyframes ultimateGoldenButton {
      0% { background-position: 0% 50%; }
      25% { background-position: 100% 0%; }
      50% { background-position: 100% 100%; }
      75% { background-position: 0% 100%; }
      100% { background-position: 0% 50%; }
    }
    
    @keyframes revealFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
    }
    
    #spin-button:hover { 
      transform: translateY(-12px) scale(1.12);
      box-shadow: 
        0 0 80px var(--primary-gold), 
        0 20px 50px rgba(0,0,0,0.8),
        inset 0 0 30px rgba(255,255,255,0.3);
    }
    
    #spin-button:active {
      transform: translateY(-5px) scale(1.05);
    }
    
    #result-message { 
      font-size: 1.8rem; 
      min-height: 35px; 
      margin-bottom: 20px; 
      color: var(--neon-blue); 
      text-shadow: 0 0 15px var(--neon-blue);
      animation: messageUltimateGlow 2.5s ease-in-out infinite alternate;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
    }
    
    @keyframes messageUltimateGlow {
      from { text-shadow: 0 0 15px var(--neon-blue); }
      to { text-shadow: 0 0 30px var(--neon-blue), 0 0 45px var(--neon-blue); }
    }
    
    #chances-counter { 
      font-size: 1.6rem; 
      color: var(--neon-pink); 
      margin-bottom: 20px; 
      font-weight: 700; 
      animation: counterUltimatePulse 1.5s ease-in-out infinite;
      font-family: 'Rajdhani', sans-serif;
      text-shadow: 0 0 10px var(--neon-pink);
    }
    
    @keyframes counterUltimatePulse {
      0%, 100% { transform: scale(1); text-shadow: 0 0 10px var(--neon-pink); }
      50% { transform: scale(1.1); text-shadow: 0 0 20px var(--neon-pink), 0 0 30px var(--neon-pink); }
    }
    
    /* ULTIMATE POPUP */
    #popup {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, rgba(0,0,0,0.95), rgba(26,0,51,0.95), rgba(51,0,102,0.95));
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 2.5rem;
      padding: 40px;
      z-index: 3000;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    
    #popup img {
      max-width: 160px;
      margin-bottom: 35px;
      animation: popupImageFloat 3s ease-in-out infinite;
    }
    
    @keyframes popupImageFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }
    
    #popup .popup-text {
      margin-bottom: 40px;
      background: linear-gradient(45deg, var(--primary-gold), var(--secondary-gold), var(--neon-blue), var(--neon-pink));
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: popupTextGradient 3s ease-in-out infinite;
      font-weight: 900;
      text-shadow: none;
      font-family: 'Rajdhani', sans-serif;
    }
    
    @keyframes popupTextGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    /* ULTIMATE TRY AGAIN BUTTON */
    #try-again-btn {
      margin-top: 30px;
      padding: 20px 50px;
      font-size: 1.6rem;
      background: linear-gradient(45deg, #ff6b6b, #ff5252, #ff4444, var(--neon-pink), #ff6b6b);
      background-size: 500% 500%;
      animation: ultimateRedButton 2.5s ease infinite;
      color: white;
      border: 3px solid #ff4444;
      border-radius: 20px;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 2px;
      box-shadow: 
        0 0 40px rgba(255, 107, 107, 0.6),
        0 10px 30px rgba(0,0,0,0.5);
      transition: all 0.4s ease;
      font-family: 'Rajdhani', sans-serif;
    }
    
    @keyframes ultimateRedButton {
      0% { background-position: 0% 50%; }
      25% { background-position: 100% 0%; }
      50% { background-position: 100% 100%; }
      75% { background-position: 0% 100%; }
      100% { background-position: 0% 50%; }
    }
    
    #try-again-btn:hover {
      transform: translateY(-5px) scale(1.08);
      box-shadow: 
        0 0 60px rgba(255, 107, 107, 0.8),
        0 15px 40px rgba(0,0,0,0.6);
    }
    
    /* ULTIMATE CLAIM BUTTON */
    #popup #claim-btn {
      margin-top: 40px;
      font-size: 2.5rem;
      padding: 30px 90px;
      background: linear-gradient(45deg, var(--primary-gold), var(--secondary-gold), #ffed4e, var(--neon-green), var(--primary-gold));
      background-size: 500% 500%;
      animation: ultimateClaimButton 2s ease infinite;
      border-radius: 50px;
      border: 5px solid var(--primary-gold);
      color: #1a0033;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 3px;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      position: relative;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
    }
    
    @keyframes ultimateClaimButton {
      0% { 
        background-position: 0% 50%; 
        box-shadow: 
          0 0 30px var(--primary-gold), 
          0 0 60px rgba(255, 215, 0, 0.6),
          0 15px 40px rgba(0,0,0,0.6);
      }
      25% { 
        background-position: 100% 0%; 
        box-shadow: 
          0 0 40px var(--neon-green), 
          0 0 80px rgba(57, 255, 20, 0.6),
          0 20px 50px rgba(0,0,0,0.7);
      }
      50% { 
        background-position: 100% 100%; 
        box-shadow: 
          0 0 50px var(--secondary-gold), 
          0 0 100px rgba(255, 237, 78, 0.7),
          0 25px 60px rgba(0,0,0,0.8);
      }
      75% { 
        background-position: 0% 100%; 
        box-shadow: 
          0 0 40px var(--primary-gold), 
          0 0 80px rgba(255, 215, 0, 0.6),
          0 20px 50px rgba(0,0,0,0.7);
      }
      100% { 
        background-position: 0% 50%; 
        box-shadow: 
          0 0 30px var(--primary-gold), 
          0 0 60px rgba(255, 215, 0, 0.6),
          0 15px 40px rgba(0,0,0,0.6);
      }
    }
    
    #popup #claim-btn:hover {
      transform: translateY(-8px) scale(1.12);
      box-shadow: 
        0 0 80px var(--primary-gold), 
        0 0 120px rgba(255, 215, 0, 0.8),
        0 30px 70px rgba(0,0,0,0.8);
    }
    
    /* ULTIMATE FIREWORKS CANVAS */
    canvas#fireworks { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh; 
      pointer-events: none; 
      display: none; 
      z-index: 3500;
    }
    
    /* RESPONSIVE DESIGN */
    @media (max-width:600px){
      #logo {max-width:140px;margin:20px auto 10px auto;}
      .header-container h1 {font-size:2.5rem; letter-spacing: 4px;}
      .header-container h2 {font-size:1.8rem; letter-spacing: 3px;}
      #instructions {font-size:1.2rem;margin-bottom:25px;padding:0 10px;}
      #game-container {width:320px;gap:18px 15px;}
      .box {width:90px;height:120px;font-size:2.5rem;}
      #follow-first-btn {padding:16px 35px;font-size:1.3rem;}
      #spin-button {padding:16px 35px;font-size:1.3rem;}
      #result-message {font-size:1.5rem;margin-bottom:18px;}
      #chances-counter {font-size:1.3rem;}
      #popup {font-size:2rem;padding:25px;}
      #popup img {max-width:120px;margin-bottom:25px;}
      #popup #claim-btn {
        font-size:1.8rem;
        padding:20px 50px;
      }
      #try-again-btn {
        padding: 16px 40px;
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <img id="logo" src="Logo.png" alt="🚀 Bandeali Enterprises Logo 🚀" />
  <div class="header-container">
    <h1>🎯 <span class="bandeali-text">BANDEALI</span> <span class="enterprises-text">ENTERPRISES</span> 🎯</h1>
    <h2>⚡ ULTIMATE TREASURE HUNT ⚡</h2>
  </div>
  <div id="instructions">🍀 Choose your destiny box and unlock amazing rewards! 🍀</div>
  <div id="chances-counter"></div>
  <div id="game-container"></div>
  <button id="follow-first-btn">🔥 FOLLOW US FOR MEGA REWARDS 🔥</button>
  <button id="spin-button">✨ REVEAL THE MAGIC ✨</button>
  <div id="result-message"></div>
  <div id="popup" tabindex="-1"></div>
  <canvas id="fireworks"></canvas>
  
  <script>
    const prizes = [
      { win: true, text: "🔥 MEGA 10% OFF" },
      { win: false, text: "🎯 Try Again!" },
      { win: true, text: "🎁 SUPER 15% OFF" },
      { win: false, text: "🎯 Try Again!" },
      { win: true, text: "💎 ULTRA 20% OFF" },
      { win: false, text: "🎯 Try Again!" },
      { win: true, text: "🎉 EPIC ₹30 OFF" },
      { win: true, text: "🎧 FREE EARPHONES" },
      { win: true, text: "💰 MEGA ₹50 CASHBACK" }
    ];
    
    const gameContainer = document.getElementById('game-container');
    const followFirstBtn = document.getElementById('follow-first-btn');
    const spinButton = document.getElementById('spin-button');
    const resultMessage = document.getElementById('result-message');
    const chancesCounter = document.getElementById('chances-counter');
    const popup = document.getElementById('popup');
    const fireworksCanvas = document.getElementById('fireworks');
    const ctx = fireworksCanvas.getContext('2d');
    
    let selectedIndex = null;
    let boxes = [];
    let gameState = 'selection';
    let chancesLeft = 3;
    let hasFollowed = false;
    let usedBoxes = [];
    
    function shuffle(array) {
      let currentIndex = array.length;
      while (currentIndex !== 0) {
        const randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
      }
      return array;
    }
    
    function updateChancesDisplay() {
      if (chancesLeft < 3) {
        chancesCounter.textContent = `🎯 ULTIMATE CHANCES LEFT: ${chancesLeft} 🎯`;
        chancesCounter.style.display = 'block';
      } else {
        chancesCounter.style.display = 'none';
      }
    }
    
    function createBoxes() {
      gameContainer.innerHTML = '';
      resultMessage.textContent = '';
      selectedIndex = null;
      boxes = [];
      gameState = 'selection';
      followFirstBtn.style.display = 'none';
      spinButton.style.display = 'none';
      
      const shuffledPrizes = shuffle([...prizes]);
      for (let i = 0; i < shuffledPrizes.length; i++) {
        const box = document.createElement('div');
        box.className = 'box';
        if (usedBoxes.includes(i)) {
          box.classList.add('disabled');
        }
        box.setAttribute('tabindex', '0');
        box.dataset.index = i;
        box.innerHTML = `<span>?</span>`;
        box.title = "Click to select this ultimate treasure box";
        box.addEventListener('click', onBoxSelect);
        gameContainer.appendChild(box);
        boxes.push({ el: box, prize: shuffledPrizes[i] });
        
        // Epic entrance animation
        box.style.opacity = '0';
        box.style.transform = 'translateY(100px) rotateX(90deg)';
        setTimeout(() => {
          box.style.transition = 'all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
          box.style.opacity = '1';
          box.style.transform = 'translateY(0) rotateX(0deg)';
        }, i * 150);
      }
      updateChancesDisplay();
    }
    
    function onBoxSelect() {
      if (selectedIndex !== null || gameState !== 'selection') return;
      if (usedBoxes.includes(Number(this.dataset.index))) return;
      
      selectedIndex = Number(this.dataset.index);
      gameState = 'follow';
      
      boxes.forEach((box, idx) => {
        if (idx !== selectedIndex) {
          box.el.classList.add('locked');
          setTimeout(() => {
            box.el.style.animation = 'megaShake 1s ease-in-out';
          }, idx * 100);
        } else {
          box.el.classList.add('active');
          createUltimateParticleBurst(box.el);
        }
      });
      
      if (!hasFollowed) {
        followFirstBtn.style.display = 'block';
        resultMessage.textContent = '🔥 FOLLOW US FOR ULTIMATE POWER! 🔥';
      } else {
        showRevealButton();
      }
    }
    
    function createUltimateParticleBurst(box) {
      const colors = ['#ffd700', '#00ffff', '#ff00ff', '#39ff14', '#ff6b6b'];
      
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.style.position = 'absolute';
        particle.style.width = '8px';
        particle.style.height = '8px';
        particle.style.background = colors[Math.floor(Math.random() * colors.length)];
        particle.style.borderRadius = '50%';
        particle.style.pointerEvents = 'none';
        particle.style.zIndex = '2000';
        particle.style.boxShadow = `0 0 10px ${particle.style.background}`;
        
        const boxRect = box.getBoundingClientRect();
        particle.style.left = boxRect.left + boxRect.width/2 + 'px';
        particle.style.top = boxRect.top + boxRect.height/2 + 'px';
        
        document.body.appendChild(particle);
        
        const angle = (i / 50) * Math.PI * 2;
        const distance = 100 + Math.random() * 100;
        const finalX = boxRect.left + boxRect.width/2 + Math.cos(angle) * distance;
        const finalY = boxRect.top + boxRect.height/2 + Math.sin(angle) * distance;
        
        particle.animate([
          { 
            transform: 'translate(0, 0) scale(1) rotate(0deg)', 
            opacity: 1 
          },
          { 
            transform: `translate(${finalX - (boxRect.left + boxRect.width/2)}px, ${finalY - (boxRect.top + boxRect.height/2)}px) scale(0) rotate(1080deg)`, 
            opacity: 0 
          }
        ], {
          duration: 1500 + Math.random() * 500,
          easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
        }).onfinish = () => {
          particle.remove();
        };
      }
    }
    
    function showRevealButton() {
      followFirstBtn.style.display = 'none';
      spinButton.style.display = 'block';
      gameState = 'reveal';
      resultMessage.textContent = '⚡ UNLEASH THE ULTIMATE POWER! ⚡';
    }
    
    followFirstBtn.addEventListener('click', () => {
      window.open('https://www.instagram.com/bandeali_enterprises', '_blank');
      
      setTimeout(() => {
        hasFollowed = true;
        showRevealButton();
        resultMessage.textContent = '🚀 ULTIMATE POWER ACTIVATED! REVEAL NOW! 🚀';
      }, 1200);
    });
    
    spinButton.addEventListener('click', () => {
      if (gameState === 'reveal') {
        revealBoxes();
      }
    });
    
    function revealBoxes() {
      resultMessage.textContent = '🔮 THE ULTIMATE MOMENT... 🔮';
      
      boxes.forEach((box, idx) => {
        setTimeout(() => {
          box.el.classList.remove('locked', 'active');
          box.el.classList.add('opened');
          box.el.innerHTML = '';
          
          if (box.prize.win) {
            const img = document.createElement('img');
            img.src = 'treasure.png';
            img.alt = 'Ultimate Treasure';
            box.el.appendChild(img);
            const textDiv = document.createElement('div');
            textDiv.className = 'text';
            textDiv.textContent = box.prize.text;
            box.el.appendChild(textDiv);
          } else {
            const textDiv = document.createElement('div');
            textDiv.className = 'text';
            textDiv.textContent = box.prize.text;
            box.el.appendChild(textDiv);
          }
        }, idx * 250);
      });
      
      spinButton.style.display = 'none';
      gameState = 'finished';
      
      setTimeout(() => {
        showResultPopup(boxes[selectedIndex].prize);
      }, boxes.length * 250 + 1000);
    }
    
    function showResultPopup(prize) {
      usedBoxes.push(selectedIndex);
      
      if (prize.win) {
        popup.innerHTML = `
          <img src="treasure.png" alt="Ultimate Victory!" />
          <div class="popup-text">🎊 ULTIMATE VICTORY! 🎊<br><br>🏆 ${prize.text} 🏆</div>
          <button id="claim-btn">💎 CLAIM ULTIMATE REWARD 💎</button>
        `;
        startUltimateFireworks();
      } else {
        chancesLeft--;
        if (chancesLeft > 0) {
          popup.innerHTML = `
            <div class="popup-text">⚡ ${prize.text} ⚡<br><br>🎯 ${chancesLeft} ULTIMATE CHANCE${chancesLeft > 1 ? 'S' : ''} REMAINING!</div>
            <button id="try-again-btn">🔥 UNLEASH AGAIN 🔥</button>
          `;
        } else {
          popup.innerHTML = `
            <div class="popup-text">🌟 ULTIMATE CHALLENGE COMPLETE! 🌟<br><br>🎮 NEW ADVENTURE AWAITS!</div>
            <button id="try-again-btn">🚀 START ULTIMATE QUEST 🚀</button>
          `;
        }
      }
      
      popup.style.display = 'flex';
      
      const claimBtn = document.getElementById('claim-btn');
      const tryAgainBtn = document.getElementById('try-again-btn');
      
      if (claimBtn) {
        claimBtn.addEventListener('click', function () {
          popup.style.display = 'none';
          stopFireworks();
          resetGame();
        });
      }
      
      if (tryAgainBtn) {
        tryAgainBtn.addEventListener('click', function () {
          popup.style.display = 'none';
          if (chancesLeft > 0) {
            createBoxes();
            document.getElementById('instructions').textContent = '⚡ CHOOSE YOUR NEXT ULTIMATE DESTINY! ⚡';
          } else {
            resetGame();
          }
        });
      }
    }
    
    function resetGame() {
      chancesLeft = 3;
      hasFollowed = false;
      usedBoxes = [];
      selectedIndex = null;
      gameState = 'selection';
      createBoxes();
      document.getElementById('instructions').textContent = '🍀 Choose your destiny box and unlock amazing rewards! 🍀';
    }
    
    // ULTIMATE FIREWORKS
    let fireworks = [];
    let fireworksAnimation;
    
    class UltimateFirework {
      constructor() {
        this.x = Math.random() * fireworksCanvas.width;
        this.y = fireworksCanvas.height + 20;
        this.vy = -(10 + Math.random() * 6);
        this.exploded = false;
        this.particles = [];
        this.colors = ['#ffd700', '#00ffff', '#ff00ff', '#39ff14', '#ff6b6b', '#ffffff'];
        this.size = 3 + Math.random() * 3;
        this.trailParticles = [];
      }
      
      update() {
        if (!this.exploded) {
          // Add trail particles
          this.trailParticles.push({
            x: this.x,
            y: this.y,
            alpha: 1,
            color: this.colors[Math.floor(Math.random() * this.colors.length)]
          });
          
          if (this.trailParticles.length > 10) {
            this.trailParticles.shift();
          }
          
          this.y += this.vy;
          this.vy += 0.2;
          if (this.vy >= -2) {
            this.exploded = true;
            for (let i = 0; i < 60; i++) {
              const angle = (2 * Math.PI / 60) * i;
              const speed = 4 + Math.random() * 6;
              this.particles.push({
                x: this.x,
                y: this.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                alpha: 1,
                color: this.colors[Math.floor(Math.random() * this.colors.length)],
                size: 2 + Math.random() * 3,
                decay: 0.01 + Math.random() * 0.02
              });
            }
          }
        } else {
          this.particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.08;
            p.alpha -= p.decay;
            p.vx *= 0.995;
          });
          this.particles = this.particles.filter(p => p.alpha > 0);
        }
        
        // Update trail
        this.trailParticles.forEach(tp => {
          tp.alpha -= 0.1;
        });
        this.trailParticles = this.trailParticles.filter(tp => tp.alpha > 0);
      }
      
      draw(ctx) {
        // Draw trail
        this.trailParticles.forEach((tp, index) => {
          ctx.globalAlpha = tp.alpha * 0.5;
          ctx.beginPath();
          ctx.arc(tp.x, tp.y, 2, 0, 2 * Math.PI);
          ctx.fillStyle = tp.color;
          ctx.shadowBlur = 10;
          ctx.shadowColor = tp.color;
          ctx.fill();
          ctx.shadowBlur = 0;
        });
        
        if (!this.exploded) {
          ctx.globalAlpha = 1;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#ffffff';
          ctx.fill();
          ctx.shadowBlur = 0;
        } else {
          this.particles.forEach(p => {
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, 2 * Math.PI);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = p.color;
            ctx.fill();
            ctx.shadowBlur = 0;
          });
        }
        ctx.globalAlpha = 1;
      }
    }
    
    function startUltimateFireworks() {
      fireworksCanvas.width = window.innerWidth;
      fireworksCanvas.height = window.innerHeight;
      fireworks = [];
      fireworksAnimation = setInterval(() => {
        if (fireworks.length < 60) fireworks.push(new UltimateFirework());
      }, 100);
      renderFireworks();
      fireworksCanvas.style.display = 'block';
    }
    
    function stopFireworks() {
      clearInterval(fireworksAnimation);
      fireworks = [];
      ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
      fireworksCanvas.style.display = 'none';
    }
    
    function renderFireworks() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
      
      fireworks.forEach(fw => {
        fw.update();
        fw.draw(ctx);
      });
      fireworks = fireworks.filter(fw => fw.particles.length > 0 || !fw.exploded);
      
      if (fireworksCanvas.style.display === 'block') {
        requestAnimationFrame(renderFireworks);
      }
    }
    
    window.addEventListener('resize', () => {
      fireworksCanvas.width = window.innerWidth;
      fireworksCanvas.height = window.innerHeight;
    });
    
    // Logo click easter egg
    document.getElementById('logo').addEventListener('click', () => {
      document.body.style.animation = 'epicBackground 2s ease infinite';
      setTimeout(() => {
        document.body.style.animation = 'epicBackground 20s ease infinite';
      }, 4000);
    });
    
    window.onload = () => {
      createBoxes();
      document.getElementById('instructions').textContent = '🍀 Choose your destiny box and unlock amazing rewards! 🍀';
    };
  </script>
</body>
</html>
