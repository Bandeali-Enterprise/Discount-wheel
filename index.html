<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bandeali Enterprises Treasure Box Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    body { 
      background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #533483 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      font-family:'Orbitron',sans-serif; 
      color:white; 
      min-height:100vh; 
      margin:0; 
      padding:0; 
      display:flex; 
      flex-direction:column; 
      align-items:center; 
      user-select:none; 
      text-align:center;
      overflow-x: hidden;
    }
    
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    /* Ultra Cool Animated Logo */
    #logo { 
      max-width: 160px; 
      margin: 25px auto 10px auto; 
      user-select: none;
      border-radius: 25px; 
      display: block; 
      padding: 8px;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      position: relative;
      overflow: hidden;
    }
    
    /* Animated Rainbow Glow for Logo */
    @keyframes rainbowGlow {
      0% { 
        box-shadow: 0 0 20px #ff0080, 0 0 40px #ff0080, 0 0 60px #ff0080;
        filter: hue-rotate(0deg);
      }
      25% { 
        box-shadow: 0 0 25px #00ff80, 0 0 50px #00ff80, 0 0 75px #00ff80;
        filter: hue-rotate(90deg);
      }
      50% { 
        box-shadow: 0 0 30px #8000ff, 0 0 60px #8000ff, 0 0 90px #8000ff;
        filter: hue-rotate(180deg);
      }
      75% { 
        box-shadow: 0 0 25px #ff8000, 0 0 50px #ff8000, 0 0 75px #ff8000;
        filter: hue-rotate(270deg);
      }
      100% { 
        box-shadow: 0 0 20px #ff0080, 0 0 40px #ff0080, 0 0 60px #ff0080;
        filter: hue-rotate(360deg);
      }
    }
    
    #logo {
      animation: rainbowGlow 3s ease-in-out infinite, floatLogo 4s ease-in-out infinite;
    }
    
    @keyframes floatLogo {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }
    
    #logo:hover {
      transform: scale(1.15) rotate(5deg);
      animation-duration: 1s;
    }
    
    /* Glowing Header */
    .header-container { max-width:600px; margin-bottom:15px;}
    .header-container h1 {
      margin:0;
      font-size:3rem;
      color:#fde14b;
      text-shadow: 0 0 20px #fde14b, 0 0 40px #f8d530, 0 0 60px #fde14b;
      font-weight:900;
      letter-spacing:6px;
      animation: textGlow 2s ease-in-out infinite alternate;
    }
    
    @keyframes textGlow {
      from { text-shadow: 0 0 20px #fde14b, 0 0 30px #f8d530, 0 0 40px #fde14b; }
      to { text-shadow: 0 0 30px #fde14b, 0 0 50px #f8d530, 0 0 70px #fde14b; }
    }
    
    .header-container h2 {
      margin:8px 0 0 0;
      font-size:2rem;
      color:#fbe74b;
      text-shadow:0 0 16px #fbe74b;
      font-weight:700;
      letter-spacing:4px;
      animation: subtleGlow 3s ease-in-out infinite alternate;
    }
    
    @keyframes subtleGlow {
      from { text-shadow: 0 0 16px #fbe74b; }
      to { text-shadow: 0 0 25px #fbe74b, 0 0 35px #fbe74b; }
    }
    
    #instructions { 
      font-size:1.25rem; 
      max-width:450px; 
      margin:20px auto 30px auto; 
      color:#eee;
      animation: fadeInUp 1s ease-out;
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    #game-container { 
      display: grid; 
      grid-template-columns:repeat(3,1fr); 
      gap:20px 18px; 
      justify-items:center; 
      width:340px; 
      max-width:95vw; 
      min-height:380px; 
      margin-bottom:20px; 
      user-select:none;
    }
    
    /* Ultra Cool Box Animations */
    .box { 
      width:100px; 
      height:130px; 
      background: linear-gradient(145deg, #1a1a2e, #16213e, #0f3460); 
      border:3px solid #fde14b; 
      border-radius:20px; 
      box-shadow:0 0 20px rgba(253, 225, 75, 0.3) inset, 0 5px 15px rgba(0,0,0,0.6); 
      font-weight:900; 
      color:#fde14b; 
      font-size:2.8rem; 
      display:flex; 
      flex-direction:column; 
      justify-content:center; 
      align-items:center; 
      cursor:pointer; 
      transition:all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
      outline:none; 
      position:relative;
      overflow: hidden;
    }
    
    /* Floating particles effect for boxes */
    .box::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(253, 225, 75, 0.1) 0%, transparent 70%);
      animation: floatingParticles 6s ease-in-out infinite;
      opacity: 0;
    }
    
    @keyframes floatingParticles {
      0%, 100% { transform: rotate(0deg) scale(0); opacity: 0; }
      50% { transform: rotate(180deg) scale(1); opacity: 0.6; }
    }
    
    /* Enhanced Hover Effect */
    @keyframes advancedPulse {
      0% { 
        box-shadow: 0 0 20px rgba(253, 225, 75, 0.3) inset, 0 5px 15px rgba(0,0,0,0.6), 0 0 10px #fde14b; 
        transform: translateY(0) scale(1);
      }
      50% { 
        box-shadow: 0 0 30px rgba(253, 225, 75, 0.6) inset, 0 8px 25px rgba(0,0,0,0.8), 0 0 30px #fde14b; 
        transform: translateY(-8px) scale(1.05);
      }
      100% { 
        box-shadow: 0 0 20px rgba(253, 225, 75, 0.3) inset, 0 5px 15px rgba(0,0,0,0.6), 0 0 10px #fde14b; 
        transform: translateY(0) scale(1);
      }
    }
    
    .box:hover {
      animation: advancedPulse 1.5s ease-in-out infinite;
    }
    
    .box:hover::after {
      opacity: 1;
      animation-duration: 2s;
    }
    
    /* Epic Selected Box Animation */
    @keyframes epicSelected {
      0% { 
        border-color:#fff44c; 
        box-shadow: 0 0 40px #fff44c inset, 0 0 20px #fff44c, 0 10px 30px rgba(0,0,0,0.8);
        transform: scale(1.1) rotateY(0deg);
      }
      25% { 
        border-color:#fde14b; 
        box-shadow: 0 0 50px #fde14b inset, 0 0 30px #fde14b, 0 15px 40px rgba(0,0,0,0.9);
        transform: scale(1.15) rotateY(90deg);
      }
      50% { 
        border-color:#fff44c; 
        box-shadow: 0 0 60px #fff44c inset, 0 0 40px #fff44c, 0 20px 50px rgba(0,0,0,1.0);
        transform: scale(1.2) rotateY(180deg);
      }
      75% { 
        border-color:#fde14b; 
        box-shadow: 0 0 50px #fde14b inset, 0 0 30px #fde14b, 0 15px 40px rgba(0,0,0,0.9);
        transform: scale(1.15) rotateY(270deg);
      }
      100% { 
        border-color:#fff44c; 
        box-shadow: 0 0 40px #fff44c inset, 0 0 20px #fff44c, 0 10px 30px rgba(0,0,0,0.8);
        transform: scale(1.1) rotateY(360deg);
      }
    }
    
    /* Spiral glow effect for selected box */
    .box.active::before {
      content: '';
      position: absolute;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      background: conic-gradient(from 0deg, transparent, #fde14b, transparent, #fff44c, transparent);
      animation: spiralGlow 2s linear infinite;
      opacity: 0.8;
      z-index: -1;
    }
    
    @keyframes spiralGlow {
      0% { transform: rotate(0deg) scale(0.8); }
      100% { transform: rotate(360deg) scale(1.2); }
    }
    
    .box.active {
      animation: epicSelected 3s ease-in-out infinite;
      color:#4b3700;
      z-index: 10;
    }
    
    /* Explosive shake for locked boxes */
    @keyframes explosiveShake {
      0%, 100% { transform: translateX(0) rotateZ(0deg); }
      10% { transform: translateX(-8px) rotateZ(-2deg); }
      20% { transform: translateX(8px) rotateZ(2deg); }
      30% { transform: translateX(-6px) rotateZ(-1deg); }
      40% { transform: translateX(6px) rotateZ(1deg); }
      50% { transform: translateX(-4px) rotateZ(-0.5deg); }
      60% { transform: translateX(4px) rotateZ(0.5deg); }
      70% { transform: translateX(-2px) rotateZ(-0.25deg); }
      80% { transform: translateX(2px) rotateZ(0.25deg); }
      90% { transform: translateX(-1px) rotateZ(0deg); }
    }
    
    .box.locked { 
      filter:grayscale(1) brightness(0.6); 
      opacity:0.7; 
      cursor:default;
      animation: explosiveShake 0.8s ease-in-out;
    }
    
    /* Mega opening animation */
    @keyframes megaOpen {
      0% { 
        transform: scale(1) rotateY(0deg) rotateX(0deg); 
        background: linear-gradient(145deg, #1a1a2e, #16213e, #0f3460);
      }
      25% { 
        transform: scale(1.3) rotateY(90deg) rotateX(15deg); 
        background: linear-gradient(145deg, #fde14b, #fff44c, #f8d530);
      }
      50% { 
        transform: scale(1.4) rotateY(180deg) rotateX(30deg); 
        background: linear-gradient(145deg, #fff44c, #fde14b, #fff856);
      }
      75% { 
        transform: scale(1.3) rotateY(270deg) rotateX(15deg); 
        background: linear-gradient(145deg, #fde14b, #f8d530, #fff44c);
      }
      100% { 
        transform: scale(1.2) rotateY(360deg) rotateX(0deg); 
        background: linear-gradient(145deg, #fde14b, #fff856, #f8d530);
      }
    }
    
    .box.opened {
      background: linear-gradient(145deg, #fde14b, #fff856, #f8d530);
      color:#4b3700;
      cursor:default;
      filter:none;
      opacity:1;
      box-shadow: 0 0 60px #fee452, 0 0 100px rgba(255, 215, 0, 0.5);
      animation: megaOpen 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      transform: scale(1.2);
    }
    
    .box.disabled {background:#333; color:#666; border-color:#666; cursor:default; opacity:0.5;}
    .box img {max-width:44px;max-height:44px;margin-bottom:6px;filter:drop-shadow(0 0 6px #c1a834);}
    .box .text {font-size:1rem; user-select:none; text-align:center; line-height:1.2;}
    
    /* Ultra Cool Follow Button */
    #follow-first-btn { 
      display:none; 
      margin:0 auto 28px auto; 
      padding:18px 50px; 
      font-size:1.4rem; 
      background:linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045, #833ab4);
      background-size: 400% 400%;
      animation: gradientButton 3s ease infinite;
      border-radius:35px; 
      border:none; 
      color:#fff; 
      cursor:pointer; 
      font-weight:900; 
      box-shadow:0 0 30px rgba(253, 29, 29, 0.5), 0 5px 15px rgba(0,0,0,0.3); 
      letter-spacing:3px;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      position: relative;
      overflow: hidden;
    }
    
    @keyframes gradientButton {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    #follow-first-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s ease;
    }
    
    #follow-first-btn:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 0 40px rgba(253, 29, 29, 0.8), 0 10px 25px rgba(0,0,0,0.4);
    }
    
    #follow-first-btn:hover::before {
      left: 100%;
    }
    
    /* Epic Reveal Button */
    #spin-button { 
      display:none; 
      margin:0 auto 28px auto; 
      padding:16px 45px; 
      font-size:1.3rem; 
      background: linear-gradient(45deg, #fde14b, #fff856, #f8d530, #fde14b); 
      background-size: 400% 400%;
      animation: goldenButton 2s ease infinite;
      border-radius:30px; 
      border:none; 
      color:#4b3700; 
      cursor:pointer; 
      font-weight:900; 
      box-shadow:0 0 25px rgba(253, 225, 75, 0.6); 
      letter-spacing:4px;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      position: relative;
    }
    
    @keyframes goldenButton {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    #spin-button:not(:disabled) {
      animation: goldenButton 2s ease infinite, buttonFloat 3s ease-in-out infinite;
    }
    
    @keyframes buttonFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    
    #spin-button:hover { 
      transform: translateY(-8px) scale(1.08);
      box-shadow: 0 0 40px rgba(253, 225, 75, 0.8), 0 10px 30px rgba(0,0,0,0.3);
    }
    
    #spin-button:active {
      transform: translateY(-2px) scale(0.98);
    }
    
    #result-message { 
      font-size:1.6rem; 
      min-height:28px; 
      margin-bottom:16px; 
      color:#fde14b; 
      text-shadow:0 0 12px #fde14b;
      animation: messageGlow 2s ease-in-out infinite alternate;
    }
    
    @keyframes messageGlow {
      from { text-shadow: 0 0 12px #fde14b; }
      to { text-shadow: 0 0 20px #fde14b, 0 0 30px #fde14b; }
    }
    
    #chances-counter { 
      font-size:1.4rem; 
      color:#ff6b6b; 
      margin-bottom:15px; 
      font-weight:700; 
      animation: counterPulse 1s ease-in-out infinite;
    }
    
    @keyframes counterPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    /* Popup Styles */
    #popup {position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);display:none;flex-direction:column;justify-content:center;align-items:center;color:white;font-size:2.25rem;padding:30px;z-index:2000;text-align:center;}
    #popup img {max-width:140px;margin-bottom:28px;}
    #popup .popup-text {margin-bottom:30px;color:#fde14b;font-weight:900;text-shadow:0 0 22px #fde14b;}
    #popup .popup-follow-row { display: flex; align-items: center; gap: 14px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap;}
    
    /* Try Again Button for chances */
    #try-again-btn {
      margin-top: 20px;
      padding: 18px 45px;
      font-size: 1.4rem;
      background: linear-gradient(45deg, #ff6b6b, #ff5252, #ff4444, #ff6b6b);
      background-size: 400% 400%;
      animation: redButton 2s ease infinite;
      color: white;
      border: none;
      border-radius: 15px;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 0 25px rgba(255, 107, 107, 0.5);
      transition: all 0.3s ease;
    }
    
    @keyframes redButton {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    #try-again-btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 0 35px rgba(255, 107, 107, 0.8);
    }
